<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mudando o DOM ao Vivo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Mudando o DOM ao Vivo</h2>

  <div class="grade">

    <div class="painel">
      <h3>Página renderizada</h3>
      <div id="pagina">
        <h1 id="titulo">Verificar a Nota</h1>
        <p>Digite uma nota de 0 a 10:</p>
        <input type="number" id="campoNota" min="0" max="10" step="0.1" placeholder="ex: 7.5">
        <button onclick="verificar()">Verificar</button>
        <p id="resultado"></p>
      </div>
    </div>

    <!-- Coluna direita: árvore DOM -->
    <div class="painel">
      <h3>Árvore DOM</h3>
      <div id="arvore"></div>
    </div>

  </div>

  <!-- Código JavaScript ao vivo -->
  <div class="painel" id="painel-codigo">
    <h3>Código JavaScript</h3>
    <pre id="codigo-js"></pre>
  </div>

  <script src="dom.js"></script>

</body>
</html>
